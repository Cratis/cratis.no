<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Cratis.">
    <meta name="color-scheme" content="light dark">
    <title>Cratis</title>
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: Canvas;
            color: CanvasText;
        }

        main {
            width: min(32rem, calc(100% - 3rem));
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(3rem, 12vw, 6rem);
            letter-spacing: -0.04em;
        }

        nav ul {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem 1.5rem;
            margin: 2rem 0 0;
            padding: 0;
            list-style: none;
        }

        a {
            color: LinkText;
            text-underline-offset: 0.2em;
        }

        a:focus-visible {
            outline: 0.2rem solid Highlight;
            outline-offset: 0.25rem;
        }
    </style>
</head>
<body>
    <main id="main">
        <h1>Cratis</h1>
        <nav aria-label="Cratis links">
            <ul>
                <li><a href="https://cratis.io">Documentation</a></li>
                <li><a href="https://github.com/Cratis">GitHub</a></li>
                <li><a href="mailto:oss@cratis.io">Contact</a></li>
            </ul>
        </nav>
    </main>
</body>
</html>
