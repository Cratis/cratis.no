name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'about/**'
      - 'ai/**'
      - 'stack/**'
      - 'studio/**'
      - 'support/**'
      - 'trust/**'
      - 'why-cratis/**'
      - 'writing/**'
      - 'assets/**'
      - '.well-known/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '9b4557a8001ed37db2d4a017989e9038.txt'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'favicon.ico'
      - 'CNAME'
      - '.github/workflows/pages.yml'
      - '.github/scripts/stage-site.sh'
      - '.github/scripts/indexnow.mjs'
      - '.github/scripts/minify-css.mjs'
      - '.github/scripts/verify-jsonld.mjs'
      - '.github/scripts/site.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

# Pages artifacts are atomic deployments; newer site updates supersede older runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate JSON-LD
        run: |
          node .github/scripts/verify-jsonld.mjs --self-test
          node .github/scripts/verify-jsonld.mjs
      - name: Test site assets and structured data
        run: node --test .github/scripts/site.test.mjs
      - name: Stage public files
        run: bash .github/scripts/stage-site.sh
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Checkout IndexNow script
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Notify IndexNow
        continue-on-error: true
        run: node .github/scripts/indexnow.mjs cratis.no 9b4557a8001ed37db2d4a017989e9038
